<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP V3.0 - Sistema de Gestión Empresarial</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script>
        // ========================
        // ERP V3.0 - Demo Estática
        // ========================
        
        const app = document.getElementById('root');
        
        // Estado
        let isLoggedIn = localStorage.getItem('erp-token') ? true : false;
        let usuario = JSON.parse(localStorage.getItem('erp-usuario') || 'null');
        
        // Función para login
        function handleLogin(email, password) {
            if (email === 'admin@erp.com' && password === 'Admin123!') {
                localStorage.setItem('erp-token', 'fake-token-xyz123');
                localStorage.setItem('erp-usuario', JSON.stringify({
                    id: '1',
                    nombre: 'Admin',
                    email: 'admin@erp.com',
                    rol: 'SUPER_ADMIN'
                }));
                isLoggedIn = true;
                usuario = JSON.parse(localStorage.getItem('erp-usuario'));
                render();
            } else {
                alert('Credenciales inválidas');
            }
        }
        
        // Función para logout
        function handleLogout() {
            localStorage.removeItem('erp-token');
            localStorage.removeItem('erp-usuario');
            isLoggedIn = false;
            usuario = null;
            render();
        }
        
        // Componente Login
        function LoginPage() {
            return `
                <div class="min-h-screen bg-gradient-to-br from-blue-600 to-blue-800 flex items-center justify-center p-4">
                    <div class="w-full max-w-md bg-white rounded-lg shadow-xl">
                        <div class="bg-gradient-to-r from-blue-600 to-blue-800 p-8 text-center">
                            <h1 class="text-4xl font-bold text-white mb-2">ERP V3.0</h1>
                            <p class="text-blue-100">Sistema de Gestión Empresarial</p>
                        </div>
                        
                        <form onsubmit="handleLoginForm(event)" class="p-8 space-y-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                                <input type="email" id="email" value="admin@erp.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="tu@email.com" required>
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Contraseña</label>
                                <input type="password" id="password" value="Admin123!" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••" required>
                            </div>
                            
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition duration-200">
                                Iniciar Sesión
                            </button>
                            
                            <div class="p-4 bg-blue-50 rounded-lg text-center">
                                <p class="text-xs text-gray-600 mb-2">Credenciales de demo:</p>
                                <p class="text-xs text-gray-700"><strong>Email:</strong> admin@erp.com</p>
                                <p class="text-xs text-gray-700"><strong>Contraseña:</strong> Admin123!</p>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }
        
        // Componente Dashboard
        function DashboardPage() {
            return `
                <div class="flex flex-col h-screen bg-gray-50">
                    <!-- Header -->
                    <header class="bg-white shadow-sm border-b border-gray-200">
                        <div class="flex items-center justify-between h-16 px-6">
                            <h1 class="text-xl font-bold text-gray-800">ERP V3.0</h1>
                            <div class="flex items-center gap-4">
                                <button class="p-2 hover:bg-gray-100 rounded-lg">🔔</button>
                                <div class="relative">
                                    <button onclick="toggleUserMenu()" class="flex items-center gap-2 p-2 hover:bg-gray-100 rounded-lg">
                                        <span class="text-sm font-medium text-gray-700">${usuario.nombre}</span>
                                    </button>
                                    <div id="userMenu" class="hidden absolute right-0 mt-2 w-48 bg-white border border-gray-200 rounded-lg shadow-lg z-50">
                                        <div class="p-3 border-b border-gray-200">
                                            <p class="text-sm font-medium text-gray-800">${usuario.nombre}</p>
                                            <p class="text-xs text-gray-500">${usuario.email}</p>
                                            <p class="text-xs text-blue-600 font-semibold">${usuario.rol}</p>
                                        </div>
                                        <button onclick="handleLogout()" class="w-full px-4 py-2 text-left text-sm text-red-600 hover:bg-red-50 transition">
                                            Cerrar sesión
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>
                    
                    <!-- Main content -->
                    <div class="flex flex-1 overflow-hidden">
                        <!-- Sidebar -->
                        <aside class="w-64 bg-gray-900 text-white p-4 space-y-2">
                            <nav class="space-y-2">
                                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-blue-600 text-white">📊 Dashboard</a>
                                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800">👥 Clientes</a>
                                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800">📦 Productos</a>
                                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800">💼 Proyectos</a>
                                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800">✓ Tareas</a>
                            </nav>
                        </aside>
                        
                        <!-- Page content -->
                        <main class="flex-1 overflow-y-auto p-6">
                            <div class="space-y-6">
                                <div>
                                    <h1 class="text-3xl font-bold text-gray-900">Dashboard</h1>
                                    <p class="text-gray-600 mt-1">Bienvenido a tu panel de control</p>
                                </div>
                                
                                <!-- Stats grid -->
                                <div class="grid grid-cols-1 md:grid-cols-5 gap-6">
                                    <div class="bg-white rounded-lg shadow p-6 hover:shadow-lg transition">
                                        <div class="flex items-center justify-between">
                                            <div>
                                                <p class="text-gray-600 text-sm font-medium">Usuarios</p>
                                                <p class="text-3xl font-bold text-gray-900 mt-2">15</p>
                                            </div>
                                            <div class="p-4 rounded-lg bg-blue-500">
                                                <span class="text-2xl">👥</span>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="bg-white rounded-lg shadow p-6 hover:shadow-lg transition">
                                        <div class="flex items-center justify-between">
                                            <div>
                                                <p class="text-gray-600 text-sm font-medium">Clientes</p>
                                                <p class="text-3xl font-bold text-gray-900 mt-2">8</p>
                                            </div>
                                            <div class="p-4 rounded-lg bg-green-500">
                                                <span class="text-2xl">🏢</span>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="bg-white rounded-lg shadow p-6 hover:shadow-lg transition">
                                        <div class="flex items-center justify-between">
                                            <div>
                                                <p class="text-gray-600 text-sm font-medium">Productos</p>
                                                <p class="text-3xl font-bold text-gray-900 mt-2">45</p>
                                            </div>
                                            <div class="p-4 rounded-lg bg-purple-500">
                                                <span class="text-2xl">📦</span>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="bg-white rounded-lg shadow p-6 hover:shadow-lg transition">
                                        <div class="flex items-center justify-between">
                                            <div>
                                                <p class="text-gray-600 text-sm font-medium">Proyectos</p>
                                                <p class="text-3xl font-bold text-gray-900 mt-2">12</p>
                                            </div>
                                            <div class="p-4 rounded-lg bg-yellow-500">
                                                <span class="text-2xl">💼</span>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="bg-white rounded-lg shadow p-6 hover:shadow-lg transition">
                                        <div class="flex items-center justify-between">
                                            <div>
                                                <p class="text-gray-600 text-sm font-medium">Tareas</p>
                                                <p class="text-3xl font-bold text-gray-900 mt-2">28</p>
                                            </div>
                                            <div class="p-4 rounded-lg bg-red-500">
                                                <span class="text-2xl">✓</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- Info box -->
                                <div class="bg-blue-50 border border-blue-200 rounded-lg p-6">
                                    <h3 class="font-bold text-blue-900 mb-2">ℹ️ ERP V3.0 Demo</h3>
                                    <p class="text-sm text-blue-800">Esta es una versión demo estática de tu ERP. El backend REST API está en <strong>http://localhost:3000/api</strong></p>
                                    <p class="text-sm text-blue-800 mt-2">Para desplegar la versión completa, revisa: <strong>COMO_EJECUTAR.md</strong> en GitHub</p>
                                </div>
                            </div>
                        </main>
                    </div>
                </div>
            `;
        }
        
        // Renderizar
        function render() {
            app.innerHTML = isLoggedIn ? DashboardPage() : LoginPage();
        }
        
        function handleLoginForm(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            handleLogin(email, password);
        }
        
        function toggleUserMenu() {
            const menu = document.getElementById('userMenu');
            menu.classList.toggle('hidden');
        }
        
        // Iniciar
        render();
    </script>
</body>
</html>
